name: Build Code AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aieditor-worker-main   # ← add this

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeAI-debug
          path: Aieditor-worker-main/app/build/outputs/apk/debug/*.apk   # ← fix path

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeAI-release
          path: Aieditor-worker-main/app/build/outputs/apk/release/*.apk  # ← fix path
